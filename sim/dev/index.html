<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Espresso machine simulator</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; background: #f6f5f2; color: #1d1d1b; }
      .page { margin: 0 auto; padding: 0.6rem 0.8rem; }
      .top { display: flex; flex-wrap: wrap; gap: 0.2rem 1.2rem; align-items: baseline; }
      h1 { font-size: 1.15rem; margin: 0; }
      h2 { font-size: 0.95rem; margin: 0; flex: 1; }
      .status { font-weight: 600; margin: 0; }
      .notice { color: #d32f2f; font-weight: 600; margin: 0; }
      .problems { margin: 0.5rem 0; padding: 0.5rem 0.8rem 0.5rem 1.8rem; background: #fdecea; border: 2px solid #d32f2f; border-radius: 0.4rem; color: #a3180f; font-weight: 600; }
      .bad, .bad th, .bad td { color: #d32f2f; font-weight: 600; }
      .board { columns: 25rem; column-gap: 0.8rem; margin-top: 0.6rem; }
      .panel { break-inside: avoid; margin: 0 0 0.8rem; padding: 0.6rem 0.7rem; background: #fff; border: 1px solid #d5d2c8; border-radius: 0.5rem; }
      .panel-head { display: flex; gap: 0.3rem; align-items: center; margin-bottom: 0.3rem; }
      .small { font-size: 0.72rem; padding: 0.2rem 0.45rem; color: #55534c; }
      .log { margin: 0.2rem 0 0.5rem; padding-left: 1.1rem; font-size: 0.9rem; }
      .foot { text-align: center; }
      .section { margin: 0.5rem 0; display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
      .section-title { width: 100%; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em; color: #6a6860; }
      button { font: inherit; padding: 0.45rem 0.7rem; border: 1px solid #b9b6ac; border-radius: 0.35rem; background: #fff; color: inherit; }
      button.active { background: #1d1d1b; color: #fff; border-color: #1d1d1b; }
      table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
      th { text-align: left; font-weight: 500; width: 45%; color: #55534c; }
      th, td { padding: 0.25rem 0.3rem; border-bottom: 1px solid #e2dfd6; font-size: 0.92rem; }
      .machine { display: block; width: 100%; max-width: 24rem; margin: 0 auto; }
      .inside { display: block; width: 100%; background: #fff; border: 1px solid #d5d2c8; }
      .fields { display: grid; gap: 0.5rem; margin: 0.6rem 0; }
      .field { display: grid; grid-template-columns: 6.5rem 1fr 4.2rem 1rem; gap: 0.5rem; align-items: center; }
      .field label { font-size: 0.9rem; color: #55534c; }
      .field input[type=range] { width: 100%; }
      input[type=text] { font: inherit; padding: 0.4rem 0.5rem; border: 1px solid #b9b6ac; border-radius: 0.35rem; background: #fff; color: inherit; }
      .exact { width: 100%; box-sizing: border-box; text-align: right; font-variant-numeric: tabular-nums; }
      .unit { font-size: 0.85rem; color: #6a6860; }
      .saved { display: inline-flex; gap: 0.15rem; }
      .remove { font-size: 0.75rem; padding: 0.45rem 0.4rem; color: #a12a16; }
      .chart { width: 100%; height: auto; background: #fff; border: 1px solid #d5d2c8; }
      .chart polyline { stroke-width: 2; vector-effect: non-scaling-stroke; }
      .chart .grid { stroke: #e7e4dc; stroke-width: 1; }
      .chart .bar { stroke: #1f5fa8; }
      .chart .flow { stroke: #2c8a57; }
      .chart .water { stroke: #c2410c; }
      .chart .target { stroke: #c2410c; stroke-dasharray: 5 4; opacity: 0.6; }
      .chart .grams { stroke: #6b4fa0; }
      .legend { display: flex; flex-wrap: wrap; gap: 0.3rem 1rem; font-size: 0.8rem; margin: 0.4rem 0; }
      .key::before { content: ""; display: inline-block; width: 0.9rem; height: 0.2rem; margin-right: 0.35rem; vertical-align: middle; }
      .key.bar::before { background: #1f5fa8; }
      .key.flow::before { background: #2c8a57; }
      .key.water::before { background: #c2410c; }
      .key.target::before { background: #c2410c; opacity: 0.5; }
      .key.grams::before { background: #6b4fa0; }
    </style>
  </head>
  <body>
    <script src="app.js"></script>
  </body>
</html>
